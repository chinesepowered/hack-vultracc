[project]
name = "tieout-lib"
version = "1.0.0"
description = "Tested bank reconciliation building blocks for the Tieout agent sandbox"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "rapidfuzz==3.10.1",
    "python-dateutil==2.9.0.post0",
    "pydantic==2.9.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tieout_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
