#!/usr/sbin/nft -f
# Sandbox host: no inbound traffic except the runner port from the control plane's private VPC address.
table inet tieout
delete table inet tieout
table inet tieout {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		udp sport 67 udp dport 68 accept
		ip saddr ${CP_VPC_IP} tcp dport 7070 accept
		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request, destination-unreachable, packet-too-big, time-exceeded } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
