[project]
name = "tieout-api"
version = "1.0.0"
description = "Tieout control plane: orchestrator, agent loop, API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "openai==1.57.0",
    "httpx==0.28.1",
    "boto3==1.35.81",
    "python-dotenv==1.0.1",
    "tieout-lib",
]

[tool.uv.sources]
tieout-lib = { path = "../../sandbox", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tieout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
