[project]
name = "tieout-runner"
version = "1.0.0"
description = "Sandbox runner: creates gVisor containers with no network for Tieout runs"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "docker==7.1.0",
    "pydantic==2.9.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]
